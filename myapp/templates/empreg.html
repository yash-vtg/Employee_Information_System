{% load static %}

<html>

<head>
    <title>Employee Registration</title>
    <link href="{% static 'css/bootstrap.css' %}" rel="stylesheet">
    <script src="{% static 'js/bootstrap.bundle.js' %}"></script>
</head>

<body>
    <!-- This Is container -->
    <div class="container my-5">
        <form action="{% url 'regsave' %}" method="post">
            {% csrf_token %}
            <div class="row border border-dark shadow shadow-4 rounded rounded-4 mx-auto bg-primary-subtle">
                <div class="col-sm-12">
                    <div class="row">
                        <div class="col-sm-12 text-center">
                            <h2 class="fw-bold mt-3 border ">REGISTRATION FORM</h2>
                        </div>
                    </div>

                    <div class="row shadow my-4 p-2 rounded-4 rounded bg-info-subtle">

                        <div class="col-sm-6">
                            <p class="fw-bold">Enter Employee ID: </p>
                            <input type="number" name="empid" class="form-control border border-dark rounded-0">
                        </div>
                        <div class="col-sm-6">
                            <p class="fw-bold">Enter Employee Name: </p>
                            <input type="text" name="empname" class="form-control border border-dark rounded-0">
                        </div>
                    </div>

                    <div class="row shadow my-4 p-2 rounded rounded-4 bg-info-subtle">
                        <div class="col-sm-6">
                            <p class="fw-bold">Enter Employee Department: </p>
                            <input type="text" name="department" class="form-control border border-dark rounded-0">
                        </div>
                        <div class="col-sm-6">
                            <p class="fw-bold">Enter Employee Designation: </p>
                            <input type="text" name="designation" class="form-control border border-dark rounded-0">
                        </div>
                    </div>

                    <div class="row shadow my-4 p-1 rounded rounded-4 bg-info-subtle">
                        <div class="col-sm-12 p-4 text-center">
                            <span class="fw-bold">Enter Employee Salary: </span>
                            <input type="number" name="salary" class=" border border-dark rounded-0">
                        </div>
                    </div>
                    <div class="row ">
                        <div class="col-sm-12 text-center mt-3 mb-3">
                            <input type="submit" value="Register" class="btn btn-outline-success">
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <!-- This Is container -->
    <br><br><br><br>
    <div class="row">
        <div class="col-sm-12">
            <div class="copyright text-center pt-3 text-dark">
                <p>© All rights reserved.Crafted by
                    <a href="#" style="text-decoration: none;">Yash Varshney</a>
                </p>
            </div>
        </div>
    </div>
</body>

</html>
